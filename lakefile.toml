name = "Zag"
version = "0.1.0"
defaultTargets = ["Zag", "Lib", "Meta", "HeapAlgebra", "IncludeDir", "Test", "zag"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.32.0"

[[lean_lib]]
name = "Zag"

[[lean_lib]]
name = "Lib"
roots = ["Lib.Peano.Defs", "Lib.Peano.Eval", "Lib.PeanoHeap"]

[[lean_lib]]
name = "Meta"
roots = ["Meta.Induction", "Meta.UnifyType", "Meta.Eval"]

[[lean_lib]]
name = "HeapAlgebra"

[[lean_lib]]
name = "IncludeDir"

[[lean_lib]]
name = "Test"
roots = ["Test.Apply", "Test.Block", "Test.Exit", "Test.EvalState", "Test.EvalTriple", "Test.Gauss", "Test.Gauss.Rec", "Test.Gauss.SSA", "Test.Heap", "Test.HeapAlgebra", "Test.Induction", "Test.Monad", "Test.Peano", "Test.While", "Test.VC", "Test.Autocorres.Examples", "Test.AutoCorresExamples", "Test.IncludeDir"]

[[lean_exe]]
name = "zag"
root = "Main"
