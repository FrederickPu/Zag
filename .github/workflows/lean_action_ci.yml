name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
      - run: lake build Zag Lang Test Lib Meta Comparator
      - run: lake test

      # Running the Comparator protocol additionally requires compatible
      # landrun and lean4export binaries; see Comparator/AutoCorres/TRUST.md.
